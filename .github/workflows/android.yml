name: Android Build and Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard against startup drawable crash
        shell: bash
        run: |
          if grep -R -nE 'painterResource\\([^)]*dalcotone_(luxe|route)_bg' android/app/src/main/java; then
            echo "::error::Layer-list drawables cannot be loaded with Compose painterResource."
            exit 1
          fi
          if grep -R -n 'painterResource' android/app/src/main/java/br/com/dalcotone/crm/MainActivity.kt; then
            echo "::warning::Review painterResource usages for unsupported XML drawable types."
          fi
          echo "Startup drawable crash guard passed on commit $GITHUB_SHA"
      - name: Compile and test Android
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Identify APK build
        shell: bash
        run: |
          echo "APK compiled from commit $GITHUB_SHA"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dal-cotone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
